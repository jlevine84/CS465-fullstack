<div class="trip-card">
    <div class="card-thumb" 
        [style.background-image]="'url(http://localhost:3000/images/' + trip.image + ')'"
        style="width: 140px; min-height: 120px; background-size: cover; background-position: center; background-repeat: no-repeat;">
    </div>
    <div class="card-content">
        <div>
            <div class="card-header-row">
                <div class="card-title">{{ trip.name }}</div>
                <span class="card-code">{{ trip.code }}</span>
            </div>
            <div class="card-meta">{{ trip.length }}</div>
            <div class="card-price">{{ trip.perPerson | currency:'USD': "symbol" }} per person</div>
        </div>
        <div class="card-actions">
            <!-- <span class="selected-badge">● Currently Editing</span> -->
        </div>
    </div>
</div>
