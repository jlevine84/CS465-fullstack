<div class="row d-flex justify-content-between align-items-center mb-4">
    <h1 class="col-10 display-5 mb-0">{{ title() }}</h1>
    <div class="col-2 w-auto">
        @if (!isLoggedIn()) {
            <a class="btn btn-outline-primary" routerLink="login">
                <span>Log In</span>
            </a>
        } @else {
            <a class="btn btn-outline-danger" (click)="onLogout()" role="button" style="cursor: pointer;">
                <span>Log Out</span>
            </a>
        }
    </div>
</div>
