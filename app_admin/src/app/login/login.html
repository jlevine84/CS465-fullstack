<div class="login-container">
    <div class="login-card">
        <!-- Header -->
        <div class="login-header">
            <p class="login-subtitle">Sign in to access the Travlr Getaways Admin Panel</p>
        </div>

        <!-- Form -->
        <form (ngSubmit)="onLoginSubmit()" class="login-form">
            
            @if (formError) {
                <div role="alert" class="alert-danger">
                    {{ formError }}
                </div>
            }

            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" 
                       id="name"
                       name="name" 
                       class="form-control" 
                       placeholder="Enter Name" 
                       [(ngModel)]="credentials.name">
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" 
                       id="email"
                       name="email" 
                       class="form-control" 
                       placeholder="Enter email address" 
                       [(ngModel)]="credentials.email">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" 
                       id="password" 
                       name="password" 
                       class="form-control" 
                       placeholder="e.g 12+ alphanumerics" 
                       [(ngModel)]="credentials.password">
            </div>

            <button type="submit" class="btn btn-primary btn-block">
                Sign In
            </button>
        </form>
    </div>
</div>
